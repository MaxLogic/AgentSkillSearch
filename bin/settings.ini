[General]
SourcesListPath=Sources.lst
ExcludesListPath=excludes.lst
CacheDbPath=cache\SkillCache.db
LogPath=logs\AgentSkillSearch.log
MaxScanThreads=6
MaxGitPullThreads=3
MaxIndexThreads=6
MaxSearchThreads=1

[Git]
GitExePath=git.exe
PullEnabled=1
MinPullIntervalMinutes=5
GitPullTimeoutSeconds=1800
GitPullArgs=pull --ff-only
SkipFolders=.git;node_modules;bin;obj;.vs;.idea;dist;build;.venv;__pycache__
TreatWorktreesAsRepos=1

[Index]
SkillFileName=SKILL.md
MaxSkillFileBytes=2000000
ComputeHasScripts=1
ScriptExtensions=py;ps1;bat;cmd;sh;js;ts;lua;rb;pl;go;rs;java;cs;cpp;c;h;pas
HasScriptsMaxFilesToScan=5000
HasScriptsSkipFolders=.git;node_modules;bin;obj;dist;build;.venv;__pycache__
NormalizeLineEndings=1

[Docker]
StartGpuCommand=docker start ollama || docker run -d --name ollama --gpus=all -p 11434:11434 -v ollama:/root/.ollama ollama/ollama
HealthCheckCommand=docker info --format "{{.ServerVersion}}"

[Search]
SearchAsYouType=0
SearchDebounceMs=2000
MaxResults=500
SnippetMaxChars=600
RecentQueryLimit=20

[Semantic]
Enabled=1
Provider=ollama
OllamaBaseUrl=http://localhost:11434
Model=mxbai-embed-large
CandidateRerankCount=300
MinScoreToShow=0.0
EmbeddingCache=1

[UI]
ShowPreviewPane=1
OpenFileOnEnter=1
TrayHotkey=
CloseToTray=0
SearchAsYouType=0
CheckForUpdatesOnStartup=1

[UIState]
CurrentPPI=96
DuplicateInfoWidth=220
LastQuery=optimize
ResultSortMode=score
ResultsColumnWidths=230;90;250;560
ResultsPaneWidth=522
SearchAsYouType=0
WindowHeight=860
WindowLeft=993
WindowTop=290
WindowWidth=1400

[SearchHistory]
MaxItems=20
